AllCops:
  NewCops: enable
  TargetRubyVersion: 4.0
  SuggestExtensions: false

Layout/LineLength:
  Max: 130

# Codebase convention is double quotes throughout
Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/FrozenStringLiteralComment:
  Enabled: true

Style/Documentation:
  Enabled: false

# CLI/engine methods are long by nature; revisit per-method if they grow
Metrics:
  Enabled: false

# Thor/CLI arg blocks intentionally ambiguous
Lint/AmbiguousBlockAssociation:
  Enabled: false

# Provider#complete keyword args are an interface contract; renaming them
# to _tools/_system would break every caller
Lint/UnusedMethodArgument:
  AllowUnusedKeywordArguments: true

Naming/MethodParameterName:
  MinNameLength: 1

# These return a success boolean but are commands, not predicates:
# MemoryService#persist, and Storage#claim_paused_session which mutates the
# row it reports on (renaming it to `?` would imply a pure query).
Naming/PredicateMethod:
  AllowedMethods:
    - persist
    - claim_paused_session

# Entrypoint defines Riggs::Error before requiring files that subclass it;
# test_helper reopens Minitest::Test to mix in helpers
Style/OneClassPerFile:
  Exclude:
    - lib/riggs.rb
    - test/test_helper.rb

Style/ClassAndModuleChildren:
  Enabled: false
